<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <title>现代前端 CI/CD 全流程：从本地提交到监控守护</title>
  <defs>
    <marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2DD4BF"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#FB923C"/>
    </marker>
  </defs>

  <!-- 背景卡片 -->
  <rect x="0" y="0" width="1200" height="675" rx="24" fill="#0D1B2A" stroke="#1E3A5F" stroke-width="2"/>
  <circle cx="70" cy="150" r="2.5" fill="#1E3A5F"/><circle cx="1130" cy="120" r="2.5" fill="#1E3A5F"/>
  <circle cx="180" cy="620" r="2" fill="#1E3A5F"/><circle cx="1050" cy="630" r="2" fill="#1E3A5F"/>

  <!-- 顶部标题 -->
  <rect x="450" y="40" width="300" height="44" rx="22" fill="#13263B" stroke="#2DD4BF" stroke-opacity="0.6"/>
  <text x="600" y="68" text-anchor="middle" font-size="21" fill="#5EEAD4">现代前端 CI/CD 全流程</text>

  <!-- 主流程线（贯穿节点后方） -->
  <line x1="40" y1="254" x2="1150" y2="254" stroke="#1E3A5F" stroke-width="3"/>
  <!-- 节点间箭头 -->
  <line x1="184" y1="254" x2="214" y2="254" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arrT)"/>
  <line x1="344" y1="254" x2="374" y2="254" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arrT)"/>
  <line x1="504" y1="254" x2="534" y2="254" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arrT)"/>
  <line x1="664" y1="254" x2="694" y2="254" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arrT)"/>
  <line x1="824" y1="254" x2="854" y2="254" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arrT)"/>
  <line x1="984" y1="254" x2="1014" y2="254" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arrT)"/>

  <!-- 节点 1：本地提交 -->
  <rect x="58" y="196" width="124" height="116" rx="16" fill="#13263B" stroke="#2DD4BF" stroke-width="2"/>
  <line x1="98" y1="252" x2="142" y2="252" stroke="#2DD4BF" stroke-width="2.5"/>
  <circle cx="120" cy="252" r="10" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
  <circle cx="120" cy="252" r="3.5" fill="#2DD4BF"/>
  <text x="120" y="298" text-anchor="middle" font-size="19" fill="#E2E8F0">本地提交</text>
  <rect x="46" y="344" width="148" height="32" rx="16" fill="#13263B" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="120" y="365" text-anchor="middle" font-size="14" fill="#94A3B8">Husky · lint-staged</text>

  <!-- 节点 2：PR 门禁 -->
  <rect x="218" y="196" width="124" height="116" rx="16" fill="#13263B" stroke="#38BDF8" stroke-width="2"/>
  <path d="M280 226 L298 233 L298 247 C298 260 290 267 280 272 C270 267 262 260 262 247 L262 233 Z" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M272 247 l6 6 l12 -12" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="280" y="298" text-anchor="middle" font-size="19" fill="#E2E8F0">PR 门禁</text>
  <rect x="206" y="344" width="148" height="32" rx="16" fill="#13263B" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="280" y="365" text-anchor="middle" font-size="14" fill="#94A3B8">Lint · 类型 · 单测</text>

  <!-- 节点 3：预览环境 -->
  <rect x="378" y="196" width="124" height="116" rx="16" fill="#13263B" stroke="#A78BFA" stroke-width="2"/>
  <rect x="408" y="228" width="64" height="46" rx="8" fill="none" stroke="#A78BFA" stroke-width="2.5"/>
  <line x1="408" y1="242" x2="472" y2="242" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="417" cy="235" r="2.2" fill="#A78BFA"/>
  <circle cx="425" cy="235" r="2.2" fill="#A78BFA"/>
  <circle cx="433" cy="235" r="2.2" fill="#A78BFA"/>
  <line x1="418" y1="261" x2="458" y2="261" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="418" y1="266" x2="444" y2="266" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <text x="440" y="298" text-anchor="middle" font-size="19" fill="#E2E8F0">预览环境</text>
  <rect x="366" y="344" width="148" height="32" rx="16" fill="#13263B" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="440" y="365" text-anchor="middle" font-size="14" fill="#94A3B8">每 PR 一个环境</text>

  <!-- 节点 4：合并集成 -->
  <rect x="538" y="196" width="124" height="116" rx="16" fill="#13263B" stroke="#4ADE80" stroke-width="2"/>
  <circle cx="582" cy="230" r="5" fill="#4ADE80"/>
  <circle cx="618" cy="230" r="5" fill="#4ADE80"/>
  <line x1="582" y1="235" x2="598" y2="252" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  <line x1="618" y1="235" x2="602" y2="252" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  <circle cx="600" cy="258" r="7" fill="none" stroke="#4ADE80" stroke-width="3"/>
  <line x1="600" y1="265" x2="600" y2="274" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
  <text x="600" y="298" text-anchor="middle" font-size="19" fill="#E2E8F0">合并集成</text>
  <rect x="526" y="344" width="148" height="32" rx="16" fill="#13263B" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="600" y="365" text-anchor="middle" font-size="14" fill="#94A3B8">Trunk-Based · 短分支</text>

  <!-- 节点 5：构建产物 -->
  <rect x="698" y="196" width="124" height="116" rx="16" fill="#13263B" stroke="#FB923C" stroke-width="2"/>
  <path d="M760 233 A13 13 0 1 0 773 246" fill="none" stroke="#FB923C" stroke-width="3" stroke-linecap="round" marker-end="url(#arrO)"/>
  <path d="M760 259 A13 13 0 1 0 747 246" fill="none" stroke="#FB923C" stroke-width="3" stroke-linecap="round" marker-end="url(#arrO)"/>
  <text x="760" y="298" text-anchor="middle" font-size="19" fill="#E2E8F0">构建产物</text>
  <rect x="686" y="344" width="148" height="32" rx="16" fill="#13263B" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="760" y="365" text-anchor="middle" font-size="14" fill="#94A3B8">Turborepo · 远程缓存</text>

  <!-- 节点 6：CD 发布 -->
  <rect x="858" y="196" width="124" height="116" rx="16" fill="#13263B" stroke="#F472B6" stroke-width="2"/>
  <ellipse cx="920" cy="248" rx="10" ry="15" fill="none" stroke="#F472B6" stroke-width="3"/>
  <circle cx="920" cy="242" r="4" fill="none" stroke="#F472B6" stroke-width="2.5"/>
  <path d="M910 258 L904 270 L914 264 Z" fill="#F472B6" opacity="0.8"/>
  <path d="M930 258 L936 270 L926 264 Z" fill="#F472B6" opacity="0.8"/>
  <path d="M920 265 q4 8 0 14 q-4 -6 0 -14" fill="#F472B6"/>
  <text x="920" y="298" text-anchor="middle" font-size="19" fill="#E2E8F0">CD 发布</text>
  <rect x="846" y="344" width="148" height="32" rx="16" fill="#13263B" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="920" y="365" text-anchor="middle" font-size="14" fill="#94A3B8">原子发布 · 灰度</text>

  <!-- 节点 7：监控守护 -->
  <rect x="1018" y="196" width="124" height="116" rx="16" fill="#13263B" stroke="#F87171" stroke-width="2"/>
  <polyline points="1058,252 1070,252 1076,238 1086,266 1092,252 1104,252" fill="none" stroke="#F87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1080" y="298" text-anchor="middle" font-size="19" fill="#E2E8F0">监控守护</text>
  <rect x="1006" y="344" width="148" height="32" rx="16" fill="#13263B" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="1080" y="365" text-anchor="middle" font-size="14" fill="#94A3B8">Sentry · Web Vitals</text>

  <!-- 反馈回路：问题回流 -->
  <path d="M1080 396 L1080 545 Q1080 560 1065 560 L295 560 Q280 560 280 545 L280 402" fill="none" stroke="#FB923C" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85" marker-end="url(#arrO)"/>
  <rect x="530" y="542" width="300" height="38" rx="19" fill="#2A1A10" stroke="#FB923C" stroke-opacity="0.6"/>
  <text x="680" y="567" text-anchor="middle" font-size="17" fill="#FDBA74">异常回滚 · 问题回流再次发布</text>

  <!-- 底部说明 -->
  <text x="600" y="634" text-anchor="middle" font-size="15" fill="#64748B">正向链路：代码一路向右流动 · 反向闭环：监控发现的问题回到开发</text>
</svg>
