<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 456" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="400" y="24" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Rust 化三雄定位对比</text>

  <!-- 第一列：Rolldown（蓝） -->
  <rect x="40" y="44" width="213" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="146" y="64" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Rolldown
    <tspan x="146" dy="16" font-size="11" font-weight="400" fill="#185FA5">Rust 化的 Rollup</tspan>
  </text>

  <rect x="40" y="116" width="213" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="146" y="134" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">兼容层
    <tspan x="146" dy="16" font-size="12" fill="#0C447C">兼容 Rollup 插件 API</tspan>
    <tspan x="146" dy="16" font-size="12" fill="#0C447C">作为 Vite 的引擎存在</tspan>
  </text>

  <rect x="40" y="200" width="213" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="146" y="218" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">生态归属
    <tspan x="146" dy="16" font-size="12" fill="#0C447C">VoidZero · Cloudflare</tspan>
    <tspan x="146" dy="16" font-size="12" fill="#0C447C">Vite 官方工具链核心</tspan>
  </text>

  <rect x="40" y="284" width="213" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="146" y="302" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">典型场景
    <tspan x="146" dy="16" font-size="12" fill="#0C447C">新项目与 Vite 系框架</tspan>
    <tspan x="146" dy="16" font-size="12" fill="#0C447C">选 Vite 即选 Rolldown</tspan>
  </text>

  <!-- 第二列：Rspack（琥珀） -->
  <rect x="293" y="44" width="213" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="399" y="64" font-size="14" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Rspack
    <tspan x="399" dy="16" font-size="11" font-weight="400" fill="#854F0B">Rust 化的 webpack</tspan>
  </text>

  <rect x="293" y="116" width="213" height="68" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="399" y="134" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">兼容层
    <tspan x="399" dy="16" font-size="12" fill="#633806">对齐 webpack 5 API</tspan>
    <tspan x="399" dy="16" font-size="12" fill="#633806">常用插件兼容度高</tspan>
  </text>

  <rect x="293" y="200" width="213" height="68" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="399" y="218" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">生态归属
    <tspan x="399" dy="16" font-size="12" fill="#633806">字节跳动开源</tspan>
    <tspan x="399" dy="16" font-size="12" fill="#633806">Rstack 全家桶核心</tspan>
  </text>

  <rect x="293" y="284" width="213" height="68" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="399" y="302" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">典型场景
    <tspan x="399" dy="16" font-size="12" fill="#633806">webpack 存量迁移首选</tspan>
    <tspan x="399" dy="16" font-size="12" fill="#633806">支持 Module Federation</tspan>
  </text>

  <!-- 第三列：Turbopack（绿） -->
  <rect x="546" y="44" width="213" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="652" y="64" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Turbopack
    <tspan x="652" dy="16" font-size="11" font-weight="400" fill="#0F6E56">Next.js 专属引擎</tspan>
  </text>

  <rect x="546" y="116" width="213" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="652" y="134" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">兼容层
    <tspan x="652" dy="16" font-size="12" fill="#085041">支持 webpack loader</tspan>
    <tspan x="652" dy="16" font-size="12" fill="#085041">不支持 webpack plugin</tspan>
  </text>

  <rect x="546" y="200" width="213" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="652" y="218" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">生态归属
    <tspan x="652" dy="16" font-size="12" fill="#085041">Vercel 出品</tspan>
    <tspan x="652" dy="16" font-size="12" fill="#085041">Next.js 16 起双默认</tspan>
  </text>

  <rect x="546" y="284" width="213" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="652" y="302" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">典型场景
    <tspan x="652" dy="16" font-size="12" fill="#085041">Next.js 项目零迁移</tspan>
    <tspan x="652" dy="16" font-size="12" fill="#085041">升级框架自动获得</tspan>
  </text>

  <!-- 结论条 -->
  <rect x="40" y="392" width="720" height="44" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="400" y="414" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">选型的本质不是比谁快，而是选兼容层与生态：先看存量 API 靠拢谁，再看生态归属</text>
</svg>
