<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="400" y="24" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Vite 7 双引擎 → Vite 8 单引擎</text>

  <!-- 左面板：Vite 7 双引擎 -->
  <rect x="40" y="44" width="330" height="268" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="56" y="64" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Vite 7 · 双引擎</text>

  <rect x="56" y="80" width="298" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="205" y="100" font-size="12" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Vite 调度层
    <tspan x="205" dy="16" font-size="11" font-weight="400" fill="#534AB7">dev server · 插件调度 · 配置解析</tspan>
  </text>

  <line x1="120" y1="136" x2="120" y2="168" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="290" y1="136" x2="290" y2="168" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="56" y="172" width="129" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="120" y="190" font-size="12" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">esbuild（Go）
    <tspan x="120" dy="16" font-size="11" font-weight="400">依赖预构建</tspan>
    <tspan x="120" dy="16" font-size="11" font-weight="400">开发转换</tspan>
  </text>

  <rect x="225" y="172" width="129" height="68" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="289" y="190" font-size="12" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Rollup（JS）
    <tspan x="289" dy="16" font-size="11" font-weight="400">生产构建</tspan>
    <tspan x="289" dy="16" font-size="11" font-weight="400">插件生态基座</tspan>
  </text>

  <text x="56" y="264" font-size="11" fill="#993C1D" text-anchor="start" dominant-baseline="central">✕ 两套插件系统互不通用</text>
  <text x="56" y="280" font-size="11" fill="#993C1D" text-anchor="start" dominant-baseline="central">✕ dev 与 prod 行为不一致</text>
  <text x="56" y="296" font-size="11" fill="#993C1D" text-anchor="start" dominant-baseline="central">✕ 生产构建慢：Rollup 跑在 JS 上</text>

  <!-- 面板之间的升级箭头 -->
  <text x="400" y="182" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">npm i</text>
  <text x="400" y="198" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">vite@8</text>
  <line x1="372" y1="210" x2="424" y2="210" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 右面板：Vite 8 单引擎 -->
  <rect x="430" y="44" width="330" height="324" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="446" y="64" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Vite 8 · 单引擎</text>

  <rect x="446" y="80" width="298" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="595" y="100" font-size="12" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Vite 调度层（不变）
    <tspan x="595" dy="16" font-size="11" font-weight="400" fill="#534AB7">dev server · 插件调度 · 配置解析</tspan>
  </text>

  <line x1="595" y1="136" x2="595" y2="168" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="446" y="172" width="298" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="595" y="192" font-size="12" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Rolldown（Rust）
    <tspan x="595" dy="16" font-size="11" font-weight="400" fill="#0F6E56">统一 dev 与 build · 兼容 Rollup API</tspan>
  </text>

  <rect x="446" y="240" width="129" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="510" y="260" font-size="12" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Oxc（Rust）
    <tspan x="510" dy="16" font-size="11" font-weight="400" fill="#0F6E56">TS/JSX 转换·压缩</tspan>
  </text>

  <rect x="615" y="240" width="129" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="679" y="260" font-size="12" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Lightning CSS
    <tspan x="679" dy="16" font-size="11" font-weight="400" fill="#0F6E56">CSS 压缩</tspan>
  </text>

  <text x="446" y="320" font-size="11" fill="#085041" text-anchor="start" dominant-baseline="central">✓ 一套引擎贯穿 dev 与 build</text>
  <text x="446" y="336" font-size="11" fill="#085041" text-anchor="start" dominant-baseline="central">✓ 一套插件系统（Rollup 兼容）</text>
  <text x="446" y="352" font-size="11" fill="#085041" text-anchor="start" dominant-baseline="central">✓ 官方基准：构建提速最高 10–30×</text>
</svg>
