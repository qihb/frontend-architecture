<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" width="800" height="412" role="img" aria-label="子应用资源缓存分层：四层缓存对象的策略与失效风险">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="400" y="26" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">子应用资源缓存分层：入口要短，产物要长</text>

  <!-- 表头 -->
  <text x="56" y="58" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">缓存对象</text>
  <text x="387" y="58" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">策略</text>
  <text x="496" y="58" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">失效风险与收益</text>

  <!-- 第一层：HTML 清单 / remoteEntry（琥珀） -->
  <rect x="40" y="76" width="720" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="56" y="104" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">HTML 清单 / remoteEntry.js</text>
  <rect x="292" y="88" width="190" height="32" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="387" y="104" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#633806">短缓存 · no-cache</text>
  <text x="496" y="104" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">发布开关被长缓存，会指向已下线产物</text>

  <!-- 第二层：importEntry 解析结果（紫） -->
  <rect x="40" y="144" width="720" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="56" y="172" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">importEntry 解析结果</text>
  <rect x="292" y="156" width="190" height="32" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="387" y="172" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#3C3489">内存缓存 · 进程内</text>
  <text x="496" y="172" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">二次进入省下拉取与解析改写</text>

  <!-- 第三层：静态产物（绿） -->
  <rect x="40" y="212" width="720" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="56" y="240" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">静态产物 JS / CSS / 字体</text>
  <rect x="292" y="224" width="190" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="387" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#085041">长缓存 · contenthash</text>
  <text x="496" y="240" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">内容变则文件名变，天然免失效，收益最大</text>

  <!-- 第四层：Service Worker 预缓存（蓝） -->
  <rect x="40" y="280" width="720" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="56" y="308" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">Service Worker 预缓存</text>
  <rect x="292" y="292" width="190" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="387" y="308" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#0C447C">主动版本 · SW 策略</text>
  <text x="496" y="308" text-anchor="start" dominant-baseline="central" font-size="11" fill="#5F5E5A">离线与二次访问最快，需处理更新时机</text>

  <!-- 结论条 -->
  <rect x="40" y="348" width="720" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="400" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">选型口诀：清单类短缓存、产物类长缓存；两者搞反就是线上白屏</text>
</svg>
