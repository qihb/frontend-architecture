<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" width="800" height="476" role="img" aria-label="保活与销毁重建的并列对比：收益与代价">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">保活与销毁重建：一组明确的权衡</text>

  <!-- 左面板：默认销毁重建（蓝） -->
  <rect x="40" y="52" width="340" height="344" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">默认：销毁重建</text>
  <text x="210" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">切出即卸载，切回从头再来</text>

  <text x="64" y="134" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0C447C">① mount：正常渲染</text>
  <text x="64" y="160" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0C447C">② 切出：unmount，DOM 与状态释放</text>
  <text x="64" y="186" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0C447C">③ 切回：重建 DOM、重跑生命周期、重新取数</text>

  <path d="M64 212 L356 212" fill="none" stroke="#185FA5" stroke-width="0.5"/>
  <text x="64" y="238" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0C447C">✓ 内存不常驻，进程保持干净</text>
  <text x="64" y="262" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0C447C">✓ 状态与数据始终最新</text>
  <rect x="64" y="278" width="292" height="44" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="210" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">△ 代价：每次切回都重走一遍加载</text>

  <!-- 右面板：保活 keep-alive（绿） -->
  <rect x="420" y="52" width="340" height="344" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="590" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">保活：keep-alive</text>
  <text x="590" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">切出只隐藏，切回恢复现场</text>

  <text x="444" y="134" text-anchor="start" dominant-baseline="central" font-size="11" fill="#085041">① mount：正常渲染</text>
  <text x="444" y="160" text-anchor="start" dominant-baseline="central" font-size="11" fill="#085041">② 切出：不 unmount，容器隐藏、状态保留</text>
  <text x="444" y="186" text-anchor="start" dominant-baseline="central" font-size="11" fill="#085041">③ 切回：直接恢复现场，近乎秒开</text>

  <path d="M444 212 L736 212" fill="none" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="444" y="238" text-anchor="start" dominant-baseline="central" font-size="11" fill="#085041">✓ 切回几乎无等待，体验接近 Tab 切换</text>
  <text x="444" y="262" text-anchor="start" dominant-baseline="central" font-size="11" fill="#085041">✓ 滚动位置、表单草稿都还在</text>
  <rect x="444" y="278" width="292" height="44" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="590" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">△ 代价一：内存常驻，实例与 DOM 不释放</text>
  <rect x="444" y="330" width="292" height="44" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="590" y="352" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">△ 代价二：状态陈旧，需主动刷新与暂停副作用</text>

  <!-- 结论条 -->
  <rect x="40" y="412" width="720" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="400" y="434" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">保活 ≠ 更优：切换频率与状态重建成本都高时才划算，否则默认销毁重建更省心</text>
</svg>
