<svg viewBox="0 0 800 466" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 总标题 -->
  <text x="400" y="30" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">共享包的两种版本策略：按契约强度选型</text>

  <!-- 左面板：实时引用（蓝） -->
  <rect x="40" y="52" width="340" height="330" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">路线一：workspace:^ 实时引用</text>
  <text x="210" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">契约强 · 保存即全仓生效</text>

  <!-- 共享包（紫） -->
  <rect x="70" y="112" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="210" y="128" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">runtime-sdk</text>
  <text x="210" y="150" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">private: true · 不发版、无版本号</text>

  <!-- 链接箭头 -->
  <path d="M210 168 L130 200" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M210 168 L295 200" fill="none" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 下游应用（琥珀） -->
  <rect x="60" y="200" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="125" y="216" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">apps/main</text>
  <text x="125" y="238" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">workspace:^</text>

  <rect x="230" y="200" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="295" y="216" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">apps/dashboard</text>
  <text x="295" y="238" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">workspace:^</text>

  <!-- 特点 -->
  <text x="64" y="282" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0C447C">✓ 版本天然全局一致，无多版本</text>
  <text x="64" y="306" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0C447C">✓ 无需发版流程，改完即用</text>
  <text x="64" y="330" text-anchor="start" dominant-baseline="central" font-size="11" fill="#993C1D">△ 下游被动升级，破坏面大</text>

  <path d="M64 352 L356 352" fill="none" stroke="#185FA5" stroke-width="0.5"/>
  <text x="210" y="370" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">适合：通信 SDK · 共享类型（协议层）</text>

  <!-- 右面板：固定版本（绿） -->
  <rect x="420" y="52" width="340" height="330" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="590" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">路线二：固定版本 + changesets</text>
  <text x="590" y="100" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">契约弱 · 发布后按需升级</text>

  <!-- 共享包（紫） -->
  <rect x="450" y="112" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="590" y="128" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">shared-components</text>
  <text x="590" y="150" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">changesets 发布：v1.2.0 → v1.3.0</text>

  <!-- 升级箭头 -->
  <path d="M580 168 L505 200" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M580 168 L675 200" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="700" y="182" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0F6E56">暂不升</text>

  <!-- 下游应用（琥珀），版本可不同 -->
  <rect x="440" y="200" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="505" y="216" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">apps/main</text>
  <text x="505" y="238" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">^1.3.0 · 已升级</text>

  <rect x="610" y="200" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="675" y="216" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">apps/order</text>
  <text x="675" y="238" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">^1.2.0 · 暂不升级</text>

  <!-- 特点 -->
  <text x="444" y="282" text-anchor="start" dominant-baseline="central" font-size="11" fill="#085041">✓ 各应用自主控制升级节奏</text>
  <text x="444" y="306" text-anchor="start" dominant-baseline="central" font-size="11" fill="#085041">✓ semver + CHANGELOG 可追溯</text>
  <text x="444" y="330" text-anchor="start" dominant-baseline="central" font-size="11" fill="#993C1D">△ 升级惰性，版本碎片化</text>

  <path d="M444 352 L736 352" fill="none" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="590" y="370" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">适合：工具库 · 业务组件库（资产层）</text>

  <!-- 底部结论条（灰） -->
  <rect x="40" y="402" width="720" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="400" y="424" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#2C2C2A">按契约强度选型：协议错配即故障 → 实时引用 ｜ 资产多版本可容忍 → 固定版本</text>
</svg>
