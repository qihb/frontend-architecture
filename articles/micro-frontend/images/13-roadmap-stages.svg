<svg viewBox="0 0 800 400" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 总标题 -->
  <text x="400" y="30" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">落地路线：先 Monorepo 后微前端，按需推进</text>
  <text x="400" y="52" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">阶段 1/2 是纯工程设施变更：用户无感、收益立现、可随时暂停；阶段 3 起才是运行时架构变更</text>

  <!-- 阶段 1（蓝） -->
  <rect x="40" y="68" width="720" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="64" y="86" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">阶段 1 · 收仓</text>
  <text x="736" y="86" text-anchor="end" dominant-baseline="central" font-size="11" fill="#185FA5">退出标准：CI 绿 · 单仓单 lockfile</text>
  <text x="64" y="108" text-anchor="start" dominant-baseline="central" font-size="11" fill="#0C447C">pnpm workspace 迁移 · 共享配置包落地 · 幽灵依赖清理</text>

  <path d="M400 126 L400 142" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 阶段 2（绿） -->
  <rect x="40" y="144" width="720" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="64" y="162" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">阶段 2 · 提效</text>
  <text x="736" y="162" text-anchor="end" dominant-baseline="central" font-size="11" fill="#0F6E56">退出标准：CI 时长收敛到受影响范围量级</text>
  <text x="64" y="184" text-anchor="start" dominant-baseline="central" font-size="11" fill="#085041">turbo.json 任务图 · outputs/env 声明 · 远程缓存接入</text>

  <path d="M400 202 L400 218" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 阶段 3（紫） -->
  <rect x="40" y="220" width="720" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="64" y="238" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">阶段 3 · 按需运行时拆分</text>
  <text x="736" y="238" text-anchor="end" dominant-baseline="central" font-size="11" fill="#633806">运行时架构变更 · 需真实业务驱动</text>
  <text x="64" y="260" text-anchor="start" dominant-baseline="central" font-size="11" fill="#3C3489">qiankun / Module Federation 接入 · 产物满足入口协议 · 通信 SDK 落地</text>

  <path d="M400 278 L400 294" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 阶段 4（灰，虚线 = 可选） -->
  <rect x="40" y="296" width="720" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="64" y="314" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">阶段 4 · 拓扑再平衡（可选）</text>
  <text x="736" y="314" text-anchor="end" dominant-baseline="central" font-size="11" fill="#5F5E5A">退出标准：迁出应用发布链路独立</text>
  <text x="64" y="336" text-anchor="start" dominant-baseline="central" font-size="11" fill="#2C2C2A">协作关系变化后，把需独立管控的子应用迁出成独立仓</text>

  <!-- 底部提醒 -->
  <text x="400" y="380" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">很多项目停在阶段 2 就是终局：没有「多团队独立发布」的真诉求，不必为了微前端而微前端</text>
</svg>
