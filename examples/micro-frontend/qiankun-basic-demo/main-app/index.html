<!doctype html>
<!--
  [main-app] 主应用（基座）的壳页面。
  对应专栏：【第 4 篇 §2】第 1 层「主应用容器层」——主应用只提供挂载容器与整体布局。
  #app 是主应用自己的壳；子应用的挂载容器 #micro-container 由 src/main.js 的 renderShell 动态生成。
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>main-app</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
