<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JSBridge Demo —— 把原生能力交给 H5</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", Monaco, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 48px;
      max-width: 640px;
      margin: 0 auto;
    }
    h1 { font-size: 20px; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; line-height: 1.6; }
    .status {
      display: inline-block;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      margin-bottom: 16px;
    }
    .status.ready { color: var(--green); border-color: var(--green); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      cursor: pointer;
      transition: all .15s ease;
      text-align: left;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button .icon { font-size: 20px; display: block; margin-bottom: 8px; }
    button .name { font-weight: 600; }
    button .desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .output {
      margin-top: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .output h2 { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    pre {
      font-family: "SF Mono", Monaco, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--green);
      min-height: 20px;
      max-height: 300px;
      overflow: auto;
    }
    img.preview { max-width: 100%; border-radius: 8px; margin-top: 8px; display: none; }
    .event-tip { color: var(--accent); font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>JSBridge Demo</h1>
  <p class="sub">演示「原生 + 内嵌 Web」桥接：H5 通过 JSBridge.call 调起相机、定位等原生能力。<br />纯浏览器环境下由 mock-native.js 模拟原生回包；真机接入见 README。</p>
  <span class="status" id="status">bridge 未就绪</span>

  <div class="grid">
    <button id="btn-camera">
      <span class="icon">📷</span>
      <span class="name">拍照 / 选图</span>
      <span class="desc">camera.takePhoto</span>
    </button>
    <button id="btn-location">
      <span class="icon">📍</span>
      <span class="name">获取定位</span>
      <span class="desc">location.getCurrentPosition</span>
    </button>
    <button id="btn-device">
      <span class="icon">📱</span>
      <span class="name">设备信息</span>
      <span class="desc">device.getInfo</span>
    </button>
    <button id="btn-scan">
      <span class="icon">🔍</span>
      <span class="name">扫码</span>
      <span class="desc">scan.scanCode</span>
    </button>
    <button id="btn-network">
      <span class="icon">🌐</span>
      <span class="name">网络类型</span>
      <span class="desc">network.getType</span>
    </button>
    <button id="btn-toast">
      <span class="icon">💬</span>
      <span class="name">Toast</span>
      <span class="desc">ui.toast</span>
    </button>
  </div>

  <div class="output">
    <h2>回包结果（Native → H5）</h2>
    <pre id="output">等待调用…</pre>
    <img class="preview" id="preview" alt="预览" />
    <div class="event-tip" id="event-tip"></div>
  </div>

  <script src="./jsbridge.js"></script>
  <script src="./mock-native.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function setStatus(text, ready) {
      $('status').textContent = text;
      $('status').className = 'status' + (ready ? ' ready' : '');
    }

    function showResult(obj) {
      $('preview').style.display = 'none';
      $('output').textContent = JSON.stringify(obj, null, 2);
      if (obj && obj.base64) {
        $('preview').src = obj.base64;
        $('preview').style.display = 'block';
      }
    }

    function showError(err) {
      $('preview').style.display = 'none';
      $('output').textContent = 'Error: ' + (err && err.message ? err.message : err);
    }

    async function invoke(method, params) {
      try {
        const result = await JSBridge.call(method, params);
        showResult(result);
      } catch (err) {
        showError(err);
      }
    }

    // 订阅 Native -> H5 的事件通道
    JSBridge.on('networkChange', (payload) => {
      $('event-tip').textContent = '[Native 事件推送] networkChange → ' + JSON.stringify(payload);
    });

    // 等 bridge 就绪后再绑定点击
    JSBridge.ready(() => {
      setStatus('bridge 已就绪', true);
      $('btn-camera').onclick = () => invoke('camera.takePhoto', { source: 'camera' });
      $('btn-location').onclick = () => invoke('location.getCurrentPosition', { accuracy: 'high' });
      $('btn-device').onclick = () => invoke('device.getInfo');
      $('btn-scan').onclick = () => invoke('scan.scanCode');
      $('btn-network').onclick = () => invoke('network.getType');
      $('btn-toast').onclick = () => invoke('ui.toast', { text: '来自 H5 的问候' });
    });
  </script>
</body>
</html>
